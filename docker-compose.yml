services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: zapsign_db
      POSTGRES_USER: zapsign_user
      POSTGRES_PASSWORD: zapsign_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data: